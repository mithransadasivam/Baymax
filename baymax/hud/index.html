<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baymax</title>
<style>
  :root{
    --bg:#f6f3f0;
    --card:#ffffff;
    --line:#e7e1dc;
    --ink:#1d1b1b;
    --ink-2:#5f5853;
    --ink-3:#9a918b;
    --red:#d9363e;
    --red-soft:rgba(217,54,62,0.12);
    --amber:#e08a1e;
    --face-1:#ffffff;
    --face-2:#ece8e4;
    --shadow:0 10px 30px rgba(120,40,40,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161414; --card:#201d1d; --line:#322e2e; --ink:#f4efec; --ink-2:#bdb3ad; --ink-3:#85796f;
      --red:#ef5a5f; --red-soft:rgba(239,90,95,0.16); --face-1:#ffffff; --face-2:#e6e1dd;
      --shadow:0 10px 30px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden;
  }
  .app{height:100%;display:flex;flex-direction:column;padding:16px 18px 14px;gap:12px;}

  header{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  header svg{width:38px;height:38px;flex-shrink:0;border-radius:10px;}
  .title{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .title b{font-size:19px;font-weight:700;letter-spacing:0.01em;}
  .title span{font-size:12px;color:var(--ink-2);}
  .conn{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-3);line-height:1.5;min-width:0;}
  .conn b{color:var(--ink-2);font-weight:600;}
  .conn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fae6a;margin-right:6px;
    animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  .face-wrap{position:relative;width:min(78%,46vh);aspect-ratio:1/1;}
  .face-wrap svg{width:100%;height:100%;display:block;overflow:visible;}
  .state{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--ink-2);height:18px;transition:color .3s;}
  .state.thinking{color:var(--amber);} .state.listening{color:var(--red);} .state.alert{color:var(--red);}

  .readout{
    background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:12px 16px;flex-shrink:0;min-height:74px;max-height:34%;display:flex;flex-direction:column;gap:4px;
    transition:border-color .3s, background .3s;
  }
  .readout .tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;}
  .readout .txt{font-size:15px;line-height:1.5;overflow-y:auto;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;}
  .readout.alert{border-color:var(--red);background:var(--red-soft);}
  .readout.alert .tag{color:var(--red);}

  .command{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 18px;
    transition:border-color .15s, box-shadow .15s;
  }
  .command:focus-within{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
  .command input{flex:1;min-width:0;background:none;border:none;outline:none;font:inherit;font-size:15px;color:var(--ink);padding:9px 0;}
  .command input::placeholder{color:var(--ink-3);}
  .command input:disabled{cursor:progress;}
  .command button{
    border:none;background:var(--red);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,opacity .2s;
  }
  .command button:hover{transform:scale(1.06);} .command button:disabled{opacity:.4;cursor:default;}

  footer{flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
  .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11px;color:var(--ink-3);}
  .meta b{color:var(--ink-2);font-weight:600;}
  .disclaimer{font-size:11px;color:var(--ink-3);line-height:1.4;}
  .disclaimer b{color:var(--red);}
</style>
</head>
<body>
<div class="app" role="group" aria-label="Baymax">
  <header>
    <svg viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f05a55"/><stop offset="1" stop-color="#c32233"/></linearGradient></defs>
      <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
      <circle cx="512" cy="512" r="330" fill="#fbfaf9"/>
      <line x1="337" y1="505" x2="687" y2="505" stroke="#1d1b1b" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="337" cy="505" rx="36" ry="42" fill="#1d1b1b"/><ellipse cx="687" cy="505" rx="36" ry="42" fill="#1d1b1b"/>
    </svg>
    <div class="title"><b>Baymax</b><span>Your personal healthcare companion</span></div>
    <div class="conn"><div><span class="dot"></span><b id="hostVal">—</b></div><div id="modelVal">—</div></div>
  </header>

  <div class="stage">
    <div class="face-wrap">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <radialGradient id="face" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="var(--face-1)"/><stop offset="1" stop-color="var(--face-2)"/></radialGradient>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
        </defs>
        <circle id="ripple1" cx="512" cy="512" r="330" fill="none" stroke="var(--red)" stroke-width="6" opacity="0"/>
        <circle id="ripple2" cx="512" cy="512" r="330" fill="none" stroke="var(--red)" stroke-width="4" opacity="0"/>
        <circle id="halo" cx="512" cy="532" r="345" fill="#d9363e" opacity="0.22" filter="url(#soft)"/>
        <g id="face">
          <circle cx="512" cy="512" r="330" fill="url(#face)"/>
          <line id="mouth" x1="337" y1="505" x2="687" y2="505" stroke="#1d1b1b" stroke-width="15" stroke-linecap="round"/>
          <ellipse id="eyeL" cx="337" cy="505" rx="36" ry="42" fill="#1d1b1b"/>
          <ellipse id="eyeR" cx="687" cy="505" rx="36" ry="42" fill="#1d1b1b"/>
        </g>
      </svg>
    </div>
    <div class="state" id="stateLabel">Ready</div>
  </div>

  <div class="readout" id="readout">
    <span class="tag" id="readoutTag">Standby</span>
    <span class="txt" id="readoutTxt">Hello. I am Baymax, your personal healthcare companion.</span>
  </div>

  <label class="command">
    <input type="text" id="commandInput" placeholder="Tell me what's wrong, or ask a health question" autocomplete="off">
    <button id="send" aria-label="Send" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </label>

  <footer>
    <div class="meta">
      <span>Mic <b id="micVal">—</b></span><span>Voice <b id="voiceVal">—</b></span>
      <span>Activation <b id="wakeVal">—</b></span><span>Up <b id="uptimeVal">00:00:00</b></span>
    </div>
    <div class="disclaimer">Baymax gives general health information, not a diagnosis. In an emergency call <b>911</b>. For thoughts of suicide, call or text <b>988</b>.</div>
  </footer>
</div>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const face=$('face'), eyeL=$('eyeL'), eyeR=$('eyeR'), mouth=$('mouth'), halo=$('halo');
  const rip1=$('ripple1'), rip2=$('ripple2');
  const stateLabel=$('stateLabel'), readout=$('readout'), readoutTag=$('readoutTag'), readoutTxt=$('readoutTxt');

  const LABEL = {idle:'Ready', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking…'};
  let current='idle', alert=false, t=0, targetLevel=0, level=0;
  let nextBlink=2.5, blinkAt=-1;

  function frame(){
    level += (targetLevel-level)*0.25;
    const s = reduceMotion ? 0 : 1;

    // Blink every few seconds while idle or listening.
    if (blinkAt<0 && t>nextBlink && current!=='thinking'){ blinkAt=t; }
    let blink=0;
    if (blinkAt>=0){
      const p=(t-blinkAt)/0.22;
      if (p>=1){ blinkAt=-1; nextBlink=t+2.5+Math.random()*3.5; } else blink=Math.sin(p*Math.PI);
    }

    let dx=0, ry=42, rx=36, lineW=15, breathe=1+0.012*Math.sin(t*1.3)*s;
    if (current==='thinking'){ dx=Math.sin(t*1.7)*20*s; ry=36; }
    if (current==='listening'){ ry=46; rx=38; breathe+=level*0.03*s; }
    if (current==='speaking'){ lineW=15+level*26; breathe+=level*0.02*s; }
    if (alert){ ry=48; rx=40; }
    ry = Math.max(4, ry*(1-0.92*blink));

    for (const [el,x] of [[eyeL,337],[eyeR,687]]){
      el.setAttribute('cx',x+dx); el.setAttribute('rx',rx); el.setAttribute('ry',ry);
    }
    mouth.setAttribute('x1',337+dx); mouth.setAttribute('x2',687+dx); mouth.setAttribute('stroke-width',lineW);
    face.setAttribute('transform',`translate(512 512) scale(${breathe}) translate(-512 -512)`);

    // Soft red halo, brighter and larger with sound; ripples only while listening or speaking.
    const glow = alert ? 0.55 : (current==='idle' ? 0.18 : 0.28+level*0.35);
    halo.setAttribute('opacity', glow.toFixed(3));
    for (const [r,phase] of [[rip1,0],[rip2,0.5]]){
      if ((current==='listening'||current==='speaking') && !reduceMotion){
        const p=((t*0.55+phase)%1);
        r.setAttribute('r',(335+p*(90+level*120)).toFixed(1));
        r.setAttribute('opacity',(0.35*(1-p)*(0.35+level*1.2)).toFixed(3));
      } else r.setAttribute('opacity',0);
    }
    t+=0.016; requestAnimationFrame(frame);
  }

  // The API Python drives (see baymax/gui.py). Each is safe to call at any time.
  window.setConfig=function(model,host,voice,wake){
    $('modelVal').textContent=model; $('hostVal').textContent=host.replace(/^https?:\/\//,'');
    $('voiceVal').textContent=voice; $('wakeVal').textContent=wake;
  };
  window.setMic=function(s){ $('micVal').textContent=s; };
  window.setState=function(mode){
    if(!LABEL[mode]) return;
    current=mode; targetLevel=0;
    stateLabel.textContent = alert && mode==='speaking' ? 'Please get help now' : LABEL[mode];
    stateLabel.className='state '+(alert&&mode==='speaking' ? 'alert' : mode);
  };
  window.setLevel=function(x){ targetLevel=Math.max(0,Math.min(1,x)); };
  window.setReadout=function(tag,text){
    // An emergency script always names 911, 988 or Poison Control: show it unmistakably.
    alert = tag==='REPLY' && /\b(call 911|9 8 8|1, 8 0 0, 2 2 2)/i.test(text);
    readout.classList.toggle('alert',alert);
    readoutTag.textContent = alert ? 'Important' : tag.charAt(0)+tag.slice(1).toLowerCase();
    readoutTxt.textContent=text; readoutTxt.scrollTop=readoutTxt.scrollHeight;
    if (current==='speaking') window.setState('speaking');
  };

  const input=$('commandInput'), send=$('send');
  function submit(){
    const text=input.value.trim();
    if(!text||!window.pywebview) return;
    input.value=''; input.disabled=true; send.disabled=true;
    window.pywebview.api.submit(text).finally(()=>{ input.disabled=false; send.disabled=false; input.focus(); });
  }
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
  send.addEventListener('click',submit);
  input.focus();

  const boot=Date.now();
  setInterval(()=>{
    const s=Math.floor((Date.now()-boot)/1000), p=n=>String(n).padStart(2,'0');
    $('uptimeVal').textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
  },1000);

  window.setState('idle');
  frame();
})();
</script>
</body>
</html>
