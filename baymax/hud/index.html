<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Baymax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ground:#0a0d13;
    --panel:#0d1219;
    --panel-line:#1b2530;
    --steel:#3d4c5c;
    --steel-dim:#232e39;
    --ice:191,232,255;
    --amber:255,156,70;
    --text-hi:#eaf3fb;
    --text-mid:#8fa3b5;
    --text-low:#4c6070;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--text-hi);
    font-family:'Chakra Petch',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
  }

  .stage{
    width:100%;
    height:100%;
    position:relative;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(var(--ice),0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      var(--panel);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid var(--panel-line);
    flex-shrink:0;
  }
  .callsign{display:flex;flex-direction:column;gap:2px;}
  .callsign .mark{font-weight:700;font-size:20px;letter-spacing:0.12em;color:var(--text-hi);}
  .callsign .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:var(--text-low);}
  .uplink{text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-mid);line-height:1.7;}
  .uplink .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:rgb(var(--ice));margin-right:6px;
    box-shadow:0 0 6px 1px rgba(var(--ice),0.8);
    animation:blip 2.4s ease-in-out infinite;
  }
  @keyframes blip{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .uplink b{color:var(--text-hi);font-weight:500;}

  .viewport{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-wrap{
    position:relative;
    width:min(70%, 72vh);
    aspect-ratio:1/1;
  }
  .bracket{position:absolute;width:22px;height:22px;border-color:var(--steel);border-style:solid;border-width:0;opacity:0.85;}
  .bracket.tl{top:-14px;left:-14px;border-top-width:2px;border-left-width:2px;}
  .bracket.tr{top:-14px;right:-14px;border-top-width:2px;border-right-width:2px;}
  .bracket.bl{bottom:-14px;left:-14px;border-bottom-width:2px;border-left-width:2px;}
  .bracket.br{bottom:-14px;right:-14px;border-bottom-width:2px;border-right-width:2px;}

  .ring-outer{position:absolute;inset:6%;animation:spin 40s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ring-outer svg{width:100%;height:100%;display:block;}

  canvas#core{position:absolute;top:14%;left:14%;width:72%;height:72%;border-radius:50%;}

  .state-label{
    position:absolute;bottom:-4px;left:50%;transform:translate(-50%,100%);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.28em;
    color:rgb(var(--ice));transition:color 0.4s ease;
  }
  .state-label.thinking{color:rgb(var(--amber));}
  .state-label.speaking{color:var(--text-hi);}

  .readout{
    min-height:54px;flex-shrink:0;
    border:1px solid var(--panel-line);
    background:var(--steel-dim);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .readout .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--text-low);flex-shrink:0;}
  .readout .txt{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-hi);line-height:1.5;
    overflow-wrap:anywhere;max-height:60px;overflow-y:auto;}

  .bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex-shrink:0;}
  .bars i{width:3px;background:var(--text-hi);border-radius:1px;transition:background 0.3s ease;}

  .command{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    border:1px solid var(--panel-line);
    background:var(--steel-dim);
    padding:0 12px;
    transition:border-color 0.15s ease;
  }
  .command:focus-within{border-color:rgb(var(--ice));}
  .command .prompt{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgb(var(--ice));flex-shrink:0;}
  .command input{
    flex:1;min-width:0;
    background:none;border:none;outline:none;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-hi);
    padding:11px 0;
  }
  .command input::placeholder{color:var(--text-low);}
  .command input:disabled{cursor:not-allowed;}

  .telemetry{
    display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;flex-shrink:0;
  }
  .telemetry div{display:flex;flex-direction:column;gap:3px;overflow:hidden;}
  .telemetry .k{color:var(--text-low);letter-spacing:0.08em;}
  .telemetry .v{color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .telemetry .v b{color:var(--text-hi);font-weight:500;}
</style>
</head>
<body>
<div class="stage" role="group" aria-label="Baymax status">
  <div class="topbar">
    <div class="callsign">
      <span class="mark">BAYMAX</span>
      <span class="sub">TACTICAL INTERFACE // MK.I</span>
    </div>
    <div class="uplink">
      <div><span class="dot"></span>UPLINK <b id="hostVal">—</b></div>
      <div>MODEL <b id="modelVal">—</b></div>
    </div>
  </div>

  <div class="viewport">
    <div class="ring-wrap">
      <span class="bracket tl"></span><span class="bracket tr"></span>
      <span class="bracket bl"></span><span class="bracket br"></span>
      <div class="ring-outer" id="ring"></div>
      <canvas id="core" width="400" height="400" aria-hidden="true"></canvas>
      <span class="state-label" id="stateLabel">IDLE</span>
    </div>
  </div>

  <div class="readout">
    <span class="tag" id="readoutTag">STANDBY</span>
    <span class="txt" id="readoutTxt">—</span>
    <div class="bars" id="bars" aria-hidden="true"></div>
  </div>

  <label class="command" id="command">
    <span class="prompt">&gt;</span>
    <input type="text" id="commandInput" placeholder="Type your question, then press Enter" autocomplete="off">
  </label>

  <div class="telemetry">
    <div><span class="k">MIC</span><span class="v" id="micVal">—</span></div>
    <div><span class="k">VOICE</span><span class="v" id="voiceVal">—</span></div>
    <div><span class="k">UPTIME</span><span class="v" id="uptimeVal"><b>00:00:00</b></span></div>
    <div><span class="k">ACTIVATION</span><span class="v" id="wakeVal">—</span></div>
  </div>
</div>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- tick-mark ring ---------- */
  const ringHost = document.getElementById('ring');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  const R = 47;
  for (let i=0;i<48;i++){
    const angle = (i/48) * Math.PI*2;
    const long = i % 4 === 0;
    const r1 = R, r2 = long ? R-5 : R-2.4;
    const x1 = 50 + Math.cos(angle)*r1, y1 = 50 + Math.sin(angle)*r1;
    const x2 = 50 + Math.cos(angle)*r2, y2 = 50 + Math.sin(angle)*r2;
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke', long ? '#4c6070' : '#232e39');
    line.setAttribute('stroke-width', long ? 1.1 : 0.7);
    svg.appendChild(line);
  }
  const circle = document.createElementNS(svgNS,'circle');
  circle.setAttribute('cx',50);circle.setAttribute('cy',50);circle.setAttribute('r',R-7);
  circle.setAttribute('fill','none');circle.setAttribute('stroke','#1b2530');circle.setAttribute('stroke-width',0.6);
  svg.appendChild(circle);
  ringHost.appendChild(svg);

  /* ---------- amplitude bars ---------- */
  const barsHost = document.getElementById('bars');
  const BAR_COUNT = 14;
  const bars = [];
  for (let i=0;i<BAR_COUNT;i++){
    const el = document.createElement('i');
    el.style.height='3px';
    barsHost.appendChild(el);
    bars.push(el);
  }

  const STATES = {
    idle:      { color:[191,232,255], glow:[191,232,255], radius:38, spread:14, speed:0.12, count:40 },
    listening: { color:[191,232,255], glow:[255,255,255], radius:44, spread:28, speed:0.32, count:58 },
    thinking:  { color:[255,156,70],  glow:[255,180,100], radius:32, spread:12, speed:1.0,  count:70 },
    speaking:  { color:[242,251,255], glow:[255,255,255], radius:48, spread:24, speed:0.55, count:56 },
  };

  const canvas = document.getElementById('core');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    const size = canvas.clientWidth || 288;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  let particles = [];
  function seed(n){
    particles = Array.from({length:n},()=>({
      angle: Math.random()*Math.PI*2,
      dist: Math.random(),
      speed: Math.random()*0.6+0.4,
      size: Math.random()*1.8+0.9,
    }));
  }

  let current = 'idle';
  let t = 0;
  // The real level Python reports (0..1), eased toward on every frame so updates that arrive
  // in bursts (once per audio block, not once per animation frame) still look continuous.
  let targetLevel = 0;
  let level = 0;

  function draw(){
    const s = STATES[current];
    const size = canvas.clientWidth || 288;
    const cx = size/2, cy = size/2;
    ctx.clearRect(0,0,size,size);

    level += (targetLevel - level) * 0.25;

    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,size*0.52);
    grad.addColorStop(0, `rgba(${s.glow.join(',')},0.30)`);
    grad.addColorStop(1, `rgba(${s.glow.join(',')},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,size,size);

    const restingPulse = current==='thinking' ? (Math.sin(t*9)*0.25+0.75) : 1;
    const amp = (current==='listening' || current==='speaking')
      ? (0.55 + level*0.9)
      : restingPulse;

    particles.forEach(p=>{
      if(!reduceMotion) p.angle += s.speed * 0.012 * p.speed;
      const r = (s.radius + s.spread*p.dist) * amp;
      const x = cx + Math.cos(p.angle)*r;
      const y = cy + Math.sin(p.angle)*r;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.color.join(',')},${0.45+p.dist*0.45})`;
      ctx.arc(x,y,p.size,0,Math.PI*2);
      ctx.fill();
    });

    const coreR = s.radius*0.46*amp;
    const cg = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(coreR,1));
    cg.addColorStop(0,'rgba(255,255,255,0.95)');
    cg.addColorStop(0.55,`rgba(${s.color.join(',')},0.85)`);
    cg.addColorStop(1,`rgba(${s.color.join(',')},0)`);
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx,cy,Math.max(coreR,1),0,Math.PI*2);
    ctx.fill();

    bars.forEach((el,i)=>{
      let h;
      if (current==='listening' || current==='speaking') h = 3 + level*16*(0.5+0.5*Math.sin(i*1.7+t*3));
      else if (current==='thinking') h = 3 + Math.abs(Math.sin(t*7 + i*2.1))*6;
      else h = 3;
      el.style.height = Math.max(3,h).toFixed(1)+'px';
      el.style.background = current==='thinking' ? 'rgb(255,156,70)' : (current==='idle' ? '#3d4c5c' : '#eaf3fb');
    });

    t += 0.016;
    requestAnimationFrame(draw);
  }

  const stateLabel = document.getElementById('stateLabel');
  const readoutTag = document.getElementById('readoutTag');
  const readoutTxt = document.getElementById('readoutTxt');
  const ring = document.getElementById('ring');

  // The API Python drives. Each function is safe to call at any time, including before the
  // first animation frame, since it only ever writes into state that draw() reads each frame.
  window.setConfig = function(model, host, voice, wakePhrase){
    document.getElementById('modelVal').textContent = model;
    document.getElementById('hostVal').textContent = host;
    document.getElementById('voiceVal').textContent = voice;
    document.getElementById('wakeVal').textContent = '"' + wakePhrase + '"';
  };

  window.setMic = function(status){
    document.getElementById('micVal').textContent = status;
  };

  window.setState = function(mode){
    if (!STATES[mode]) return;
    current = mode;
    seed(STATES[mode].count);
    targetLevel = 0;
    stateLabel.textContent = mode.toUpperCase();
    stateLabel.className = 'state-label ' + mode;
    ring.style.animationDuration = mode==='thinking' ? '9s' : mode==='listening' ? '22s' : '40s';
  };

  window.setLevel = function(x){
    targetLevel = Math.max(0, Math.min(1, x));
  };

  window.setReadout = function(tag, text){
    readoutTag.textContent = tag;
    readoutTxt.textContent = text;
    readoutTxt.scrollTop = readoutTxt.scrollHeight;
  };

  const commandInput = document.getElementById('commandInput');
  commandInput.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    const text = commandInput.value.trim();
    if (!text || !window.pywebview) return;
    commandInput.value = '';
    commandInput.disabled = true;
    window.pywebview.api.submit(text).finally(() => {
      commandInput.disabled = false;
      commandInput.focus();
    });
  });

  resize();
  window.addEventListener('resize', resize);
  seed(STATES.idle.count);
  window.setState('idle');
  draw();

  const bootTime = Date.now();
  const uptimeVal = document.getElementById('uptimeVal');
  setInterval(()=>{
    const s = Math.floor((Date.now()-bootTime)/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    uptimeVal.innerHTML = '<b>'+hh+':'+mm+':'+ss+'</b>';
  }, 1000);
})();
</script>
</body>
</html>
