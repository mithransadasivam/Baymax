[project]
name = "baymax"
version = "0.1.0"
description = "Baymax: a local, offline personal healthcare companion you can talk or type to."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "faster-whisper>=1.1",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "ollama>=0.4",
    "openwakeword>=0.6.0",
    "piper-tts>=1.3",
    "pypdf>=6.19.0",
    "pywebview>=6.2.1",
    "sounddevice>=0.5",
]

[project.scripts]
baymax = "baymax.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
